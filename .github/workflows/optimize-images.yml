name: Optimize images

on:
  push:
    paths:
      - 'fotos/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install imagemin CLI and plugins
        run: |
          npm install -g imagemin-cli imagemin-mozjpeg imagemin-pngquant

      - name: Optimize images to fotos/optimized
        run: |
          mkdir -p fotos/optimized
          npx imagemin 'fotos/*.{jpg,jpeg,png}' --plugin=imagemin-mozjpeg --plugin=imagemin-pngquant --out-dir=fotos/optimized || true

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fotos/optimized || true
          git commit -m "chore: add optimized images" || echo "no changes to commit"
          git push origin HEAD:main || echo "push failed"
